<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#07090f"/>

  <!-- Lines first (behind nodes) -->
  <!-- Center to top -->
  <line x1="32" y1="18" x2="32" y2="10" stroke="#c084fc" stroke-width="2" opacity="0.6"/>
  <!-- Center to bottom-left -->
  <line x1="24" y1="42" x2="16" y2="52" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <!-- Center to bottom-right -->
  <line x1="40" y1="42" x2="48" y2="52" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- Top child node -->
  <circle cx="32" cy="7" r="5" fill="#c084fc" opacity="0.85"/>

  <!-- Bottom-left child node -->
  <circle cx="13" cy="55" r="5" fill="#38bdf8" opacity="0.85"/>

  <!-- Bottom-right child node -->
  <circle cx="51" cy="55" r="5" fill="#38bdf8" opacity="0.85"/>

  <!-- Center node (on top) -->
  <circle cx="32" cy="32" r="10" fill="#38bdf8"/>
  <!-- Glow -->
  <circle cx="32" cy="32" r="10" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.2"/>
</svg>
