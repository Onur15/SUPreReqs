<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#07090f"/>
  
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>

  <!-- Center node -->
  <circle cx="32" cy="32" r="6" fill="#38bdf8" opacity="0.95"/>

  <!-- Top node -->
  <circle cx="32" cy="10" r="4.5" fill="#c084fc"/>
  <!-- Line center to top -->
  <line x1="32" y1="26" x2="32" y2="14.5" stroke="#c084fc" stroke-width="1.5" opacity="0.7"/>

  <!-- Bottom-left node -->
  <circle cx="13" cy="50" r="4.5" fill="#38bdf8" opacity="0.7"/>
  <!-- Line center to bottom-left -->
  <line x1="27.5" y1="36.5" x2="16" y2="46.5" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>

  <!-- Bottom-right node -->
  <circle cx="51" cy="50" r="4.5" fill="#38bdf8" opacity="0.7"/>
  <!-- Line center to bottom-right -->
  <line x1="36.5" y1="36.5" x2="48" y2="46.5" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>

  <!-- Top node's children -->
  <circle cx="16" cy="10" r="3" fill="#c084fc" opacity="0.5"/>
  <line x1="27.5" y1="10" x2="19" y2="10" stroke="#c084fc" stroke-width="1.2" opacity="0.4"/>

  <circle cx="48" cy="10" r="3" fill="#c084fc" opacity="0.5"/>
  <line x1="36.5" y1="10" x2="45" y2="10" stroke="#c084fc" stroke-width="1.2" opacity="0.4"/>

  <!-- Glow on center -->
  <circle cx="32" cy="32" r="6" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.2"/>
</svg>
